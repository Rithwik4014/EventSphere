{% extends "base.html" %}
{% block title %}Sign In – EventSphere{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <div class="text-center mb-4">
                    <div class="avatar bg-primary-subtle text-primary rounded-circle d-inline-flex p-3 mb-2">
                        <i class="bi bi-person-lock fs-2"></i>
                    </div>
                    <h3 class="fw-bold">Welcome Back</h3>
                    <p class="text-muted small">Sign in to manage your bookings and explore events.</p>
                </div>

                <form id="login-form">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0" id="email" required placeholder="name@example.com">
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label fw-semibold mb-0">Password</label>
                            <a href="/forgot-password" class="small text-primary text-decoration-none fw-semibold">Forgot Password?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" required placeholder="••••••••">
                        </div>
                    </div>

                    <button type="submit" id="btn-login" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold mt-3">
                        <span id="login-spinner" class="spinner-border spinner-border-sm me-2" style="display: none;"></span>
                        Sign In
                    </button>
                </form>

                <hr class="my-4">

                <!-- Quick Fill Section -->
                <div class="bg-light p-3 rounded-3 text-center mb-3">
                    <span class="small text-muted d-block mb-2 fw-semibold">Quick Fill:</span>
                    <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="fillStudent()">
                        <i class="bi bi-person me-1"></i>Fill Student
                    </button>
                </div>

                <div class="text-center small text-muted">
                    Don't have an account yet? <a href="/register" class="fw-bold text-primary text-decoration-none">Create Account</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function fillStudent() {
    document.getElementById('email').value = 'rithwik@edusphere.in';
    document.getElementById('password').value = 'rithwik123';
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-login');
    const spinner = document.getElementById('login-spinner');
    
    btn.disabled = true;
    spinner.style.display = 'inline-block';

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        btn.disabled = false;
        spinner.style.display = 'none';

        if (data.success) {
            sessionStorage.setItem('eventsphere_user', JSON.stringify(data.user));
            showAlert('Login successful! Redirecting...', 'success');
            setTimeout(() => {
                if (data.user.role === 'admin') {
                    window.location.href = '/admin/dashboard';
                } else {
                    window.location.href = '/events';
                }
            }, 800);
        } else {
            showAlert(data.error || 'Login failed. Please check credentials.', 'danger');
        }
    } catch (err) {
        btn.disabled = false;
        spinner.style.display = 'none';
        showAlert('An error occurred during sign in.', 'danger');
    }
});
</script>
{% endblock %}
