{% extends "base.html" %}
{% block title %}Forgot Password – EventSphere{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <div class="text-center mb-4">
                    <div class="avatar bg-warning-subtle text-warning rounded-circle d-inline-flex p-3 mb-2">
                        <i class="bi bi-key-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold">Forgot Password?</h3>
                    <p class="text-muted small">Enter your account email to receive a password recovery link.</p>
                </div>

                <div id="notice-container"></div>

                <form id="forgot-form">
                    <div class="mb-3">
                        <label for="reset-email" class="form-label fw-semibold">Registered Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0" id="reset-email" required placeholder="name@example.com">
                        </div>
                    </div>

                    <button type="submit" id="btn-submit-forgot" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold mt-2">
                        <span id="forgot-spinner" class="spinner-border spinner-border-sm me-2" style="display: none;"></span>
                        Send Recovery Link
                    </button>
                </form>

                <hr class="my-4">

                <div class="text-center small">
                    Remember your password? <a href="/login" class="fw-bold text-primary text-decoration-none">Back to Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-submit-forgot');
    const spinner = document.getElementById('forgot-spinner');
    const noticeContainer = document.getElementById('notice-container');
    noticeContainer.innerHTML = '';

    btn.disabled = true;
    spinner.style.display = 'inline-block';

    const email = document.getElementById('reset-email').value;

    try {
        const res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await res.json();

        btn.disabled = false;
        spinner.style.display = 'none';

        if (data.success) {
            noticeContainer.innerHTML = `
                <div class="alert alert-success border-0 shadow-sm rounded-3 mb-3">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                        <div class="small">${data.message || 'Password reset instructions have been sent.'}</div>
                    </div>
                </div>
            `;
        } else {
            // Check if email delivery is unconfigured
            if (data.email_configured === false) {
                noticeContainer.innerHTML = `
                    <div class="alert alert-warning border-0 shadow-sm rounded-3 mb-3">
                        <div class="d-flex">
                            <i class="bi bi-exclamation-triangle-fill text-warning me-2 fs-5 flex-shrink-0"></i>
                            <div class="small">
                                <strong>Email Delivery Unconfigured:</strong>
                                <p class="mb-0 mt-1">${data.error || 'Password recovery requires email configuration. No SMTP server is currently configured.'}</p>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                noticeContainer.innerHTML = `
                    <div class="alert alert-danger border-0 shadow-sm rounded-3 mb-3">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-x-circle-fill me-2 fs-5"></i>
                            <div class="small">${data.error || 'Password recovery request failed.'}</div>
                        </div>
                    </div>
                `;
            }
        }
    } catch (err) {
        btn.disabled = false;
        spinner.style.display = 'none';
        noticeContainer.innerHTML = `
            <div class="alert alert-danger border-0 shadow-sm rounded-3 mb-3">
                <div class="small">An error occurred while submitting your request.</div>
            </div>
        `;
    }
});
</script>
{% endblock %}
