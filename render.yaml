services:
  - type: web
    name: eventsphere
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: FLASK_ENV
        value: production
      - key: DB_NAME
        value: eventsphere_db
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
